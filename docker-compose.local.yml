x-code-server-base: &code-server-base
  build:
    context: .
    dockerfile: Dockerfile.codeserver
  image: lms-code-server:latest
  restart: unless-stopped
  networks:
    - lms-net
  deploy:
    resources:
      limits:
        memory: 1G
      reservations:
        memory: 256M

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - code-server-1
      - code-server-2
      - code-server-3
    networks:
      - lms-net
    restart: unless-stopped

  # Each code-server instance can handle multiple students
  # using subdirectories
  code-server-1:
    <<: *code-server-base
    volumes:
      - ./workspaces:/home/coder/workspaces
      
  code-server-2:
    <<: *code-server-base
    volumes:
      - ./workspaces:/home/coder/workspaces
      
  code-server-3:
    <<: *code-server-base
    volumes:
      - ./workspaces:/home/coder/workspaces

networks:
  lms-net:
    driver: bridge