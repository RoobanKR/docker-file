# ─────────────────────────────────────────────────────────────────────────────
# Nginx — LOCAL TESTING (3 code-server instances)
# Same sticky-session logic as production, just fewer backends.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 4096;
    multi_accept       on;
}

http {

    # consistent hash on cs_node cookie → same student always same container
    upstream code_servers {
        hash $cookie_cs_node consistent;
        server code-server-1:8080;
        server code-server-2:8080;
        server code-server-3:8080;
        keepalive 32;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile          on;
    tcp_nodelay       on;
    keepalive_timeout 86400;

    server {
        listen 8080;

        proxy_buffer_size        128k;
        proxy_buffers            8 256k;
        proxy_busy_buffers_size  256k;
        client_max_body_size     50M;

        # Sets sticky cookie, then redirects to the student's own folder in VS Code
        location = /cs-init {
            add_header Set-Cookie "cs_node=$arg_uid; Path=/; Max-Age=86400; SameSite=Lax";
            return 302 "/?folder=/home/coder/project/$arg_uid";
        }

        # All VS Code traffic (HTTP + WebSocket)
        location / {
            proxy_pass         http://code_servers;
            proxy_http_version 1.1;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout    86400s;
            proxy_send_timeout    86400s;
            proxy_connect_timeout 10s;
        }
    }
}
