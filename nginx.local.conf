events {
    worker_connections 1024;
}

http {
    upstream code-server-backend {
        hash $cookie_cs_node consistent;
        server code-server-1:8080;
        server code-server-2:8080;
        server code-server-3:8080;
    }

    server {
        listen 8080;
        
        # Extract student subdir from URL parameter or cookie
        # This ensures the right volume gets mounted
        location / {
            # Pass student ID to the code-server container via header
            proxy_pass http://code-server-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Student-Subdir $arg_uid;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Long timeout for WebSocket connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        
        # Endpoint to set sticky cookie
        location /cs-init {
            add_header Set-Cookie "cs_node=$upstream_cookie_code-server-backend; Path=/; HttpOnly";
            return 204;
        }
    }
}