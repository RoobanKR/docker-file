# ─────────────────────────────────────────────────────────────────────────────
# Nginx — LMS code-server load balancer
# 20 instances · consistent-hash sticky sessions · WebSocket support
#
# Sticky session flow:
#   1. Student's iframe loads  /cs-init?uid=student-<userId>
#   2. Nginx sets cookie  cs_node=student-<userId>  and redirects to VS Code
#   3. All further requests carry that cookie
#   4. consistent hash → always the SAME container → VS Code session stays alive
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 16384;
    multi_accept       on;
    use                epoll;
}

http {

    # ── Upstream: 20 code-server instances ───────────────────────────────────
    # consistent hash on cs_node cookie → deterministic routing per student
    upstream code_servers {
        hash $cookie_cs_node consistent;

        server code-server-1:8080;
        server code-server-2:8080;
        server code-server-3:8080;
        server code-server-4:8080;
        server code-server-5:8080;
        server code-server-6:8080;
        server code-server-7:8080;
        server code-server-8:8080;
        server code-server-9:8080;
        server code-server-10:8080;
        server code-server-11:8080;
        server code-server-12:8080;
        server code-server-13:8080;
        server code-server-14:8080;
        server code-server-15:8080;
        server code-server-16:8080;
        server code-server-17:8080;
        server code-server-18:8080;
        server code-server-19:8080;
        server code-server-20:8080;

        keepalive 128;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance tuning ────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  86400;
    types_hash_max_size 2048;

    server {
        listen 8080;

        # Large buffers for VS Code (extensions / large JSON payloads)
        proxy_buffer_size        256k;
        proxy_buffers            8 512k;
        proxy_busy_buffers_size  512k;
        client_max_body_size     50M;

        # ── Cookie init — sets sticky cookie then redirects to VS Code ────────
        # Called ONCE per student when iframe first loads.
        # Sets cs_node on :8080 origin, then redirects to actual VS Code URL.
        location = /cs-init {
            add_header Set-Cookie "cs_node=$arg_uid; Path=/; Max-Age=86400; SameSite=Lax";
            return 302 "/?folder=/home/coder/project/$arg_uid";
        }

        # ── All VS Code traffic (HTTP + WebSocket) ────────────────────────────
        location / {
            proxy_pass         http://code_servers;
            proxy_http_version 1.1;

            # WebSocket upgrade
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Forward real client info
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeouts — VS Code keeps WebSocket connections open
            proxy_read_timeout    86400s;
            proxy_send_timeout    86400s;
            proxy_connect_timeout 10s;
        }
    }
}
